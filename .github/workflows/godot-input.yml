name: Godot input smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  godot-input:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.6.1 (without .NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: false
      - name: Import resources and parse scripts
        run: godot --headless --path . --editor --import --quit
      - name: Run input and UI smoke test
        run: godot --headless --path . --script res://game/tests/input_smoke.gd
