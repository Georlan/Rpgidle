name: Validate structure

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests and required documentation
        run: python3 scripts/validate_structure.py
      - name: Validate visual slice assets and navigation
        run: python3 scripts/validate_visual_slice.py
      - name: Validate project skill contract
        run: python3 scripts/validate_production_guidance.py
      - name: Validate pose atlas PNG integrity
        run: python3 scripts/validate_pose_atlas.py
      - name: Verify new world art sources and exports
        run: python3 scripts/validate_world_art.py
      - name: Validate static bestiary catalog
        run: python3 scripts/validate_bestiary.py
      - name: Validate non-linear evolution candidate graph
        run: python3 scripts/validate_evolution_preview.py
      - name: Validate concept portraits PNG structure
        run: python3 scripts/validate_evolution_art.py
      - name: Check JavaScript syntax
        run: node --check prototypes/visual-slice-v02/app.js
